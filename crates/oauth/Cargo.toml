[package]
name = "oauth"
version.workspace = true
authors.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2", "charset", "form"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.44"
url = "2.5.4"

[dev-dependencies]
tokio = { version = "1.51.1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
