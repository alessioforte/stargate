[package]
name = "ctx"
description = "Signed internal request context contract for Stargate"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true

[dependencies]
base64 = "0.23.1"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
rsa = "0.9.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
ulid = "3.0.0"

[dev-dependencies]
criterion = "0.8.2"
rayon = "1.12.0"

[[bench]]
name = "internal_context_signing"
harness = false
