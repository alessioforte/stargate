[package]
name = "pw"
version.workspace = true
authors.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argon2 = { workspace = true }
base64 = { workspace = true }
# argon2 0.6 no longer re-exports password-hash: the hashing types come from
# here. `getrandom` provides the salt generation used by `hash_password`, so
# this must stay on the password-hash version argon2 itself depends on.
password-hash = { workspace = true, features = ["getrandom"] }
hex = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
