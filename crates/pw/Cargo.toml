[package]
name = "pw"
version.workspace = true
authors.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argon2 = "0.5.3"
base64 = "0.23.1"
# argon2 re-exports password-hash; the explicit dep enables `getrandom` so
# `OsRng` for salt generation resolves even when pw is built standalone.
password-hash = { version = "0.6.1", features = ["getrandom"] }
hex = "0.4.3"
rand = "0.10.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"

[dev-dependencies]
serde_json = "1.0"
