[package]
name = "db"
version.workspace = true
authors.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.98"
async-trait = "0.1.88"
chrono = "0.4.43"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["chrono", "postgres", "runtime-tokio", "sqlite", "time"] }
ulid = "1.2.1"
utoipa = "5.3.1"

[features]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]
