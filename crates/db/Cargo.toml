[package]
name = "db"
version.workspace = true
authors.workspace = true
description.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.98"
async-recursion = "1.1.1"
async-trait = "0.1.88"
chrono = "0.4.41"
log = "0.4.27"
objectid = { version = "0.2.0", features = ["serde"] }
once_cell = "1.21.3"
serde = { version = "1.0.219", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["any", "postgres", "runtime-tokio", "sqlite", "time", "uuid"] }
surrealdb = { version = "2.3.3", features = ["http", "protocol-http", "kv-surrealkv"] }
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread"] }
utoipa = { version = "5.3.1", features = ["actix_extras", "yaml"] }
uuid = { version = "1.17.0", features = ["v4"] }
