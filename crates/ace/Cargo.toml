[package]
name = "ace"
description = "Access Control Engine for Stargate"
version.workspace = true
authors.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The engine stays lean: no chrono clock/wasmbind, only its std surface.
chrono = { workspace = true, default-features = false, features = ["std"] }
serde_json = { workspace = true }

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "advanced_usage"
path = "examples/advanced_usage.rs"

[[example]]
name = "extended_features"
path = "examples/extended_features.rs"

[[example]]
name = "practical_usage"
path = "examples/practical_usage.rs"
