[package]
name = "gate"
version.workspace = true
authors.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ace = { path = "../ace" }
arc-swap = "1.8.1"
chrono = "0.4.44"
lb = { path = "../lb" }
lim = { path = "../lim" }
matchit = "0.9.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml_bw = "2.5.4"
tools = { path = "../tools" }
tracing = "0.1.44"
utoipa = { version = "5.3.1", features = ["actix_extras", "yaml"] }

[features]
default = []
memory = ["lim/memory"]
redis = ["lim/redis"]
