[package]
name = "gate"
version.workspace = true
authors.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ace = { path = "../ace" }
arc-swap = "1.9.2"
chrono = "0.4.45"
indexmap = { version = "2.14.0", features = ["serde"] }
lb = { path = "../lb" }
lim = { path = "../lim" }
matchit = "0.9.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.1.0"
serde_json = "1.0.151"
tools = { path = "../tools" }
tracing = "0.1.44"
utoipa = { version = "5.5.0", features = ["axum_extras", "yaml"] }

[features]
default = []
memory = ["lim/memory"]
redis = ["lim/redis"]
