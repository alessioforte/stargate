[package]
name = "store"
version.workspace = true
authors.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = { version = "6.2.1", optional = true }
lz4_flex = { version = "0.14", optional = true }
portable-atomic = { version = "1.15.0", features = ["require-cas"] }
redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager"], optional = true }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
tracing = "0.1.44"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }
env_logger = "0.11"

[features]
default = []
memory = ["dep:dashmap"]
redis = ["dep:redis"]
compression = ["dep:lz4_flex"]

[[bench]]
name = "memory_store_bench"
harness = false
required-features = ["memory"]
