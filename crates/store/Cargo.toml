[package]
name = "store"
version.workspace = true
authors.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.88"
chrono = { version = "0.4.43", features = ["serde"] }
dashmap = { version = "6.1.0", optional = true }
lz4_flex = { version = "0.11", optional = true }
portable-atomic = { version = "1.11.1", features = ["require-cas"] }
redis = { version = "0.32.7", features = ["tokio-comp", "connection-manager"], optional = true }
rmp-serde = "1.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.49.0", features = ["fs", "macros", "rt-multi-thread", "time"] }
tracing = "0.1.44"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["async_tokio"] }
env_logger = "0.11"

[features]
default = []
memory = ["dep:dashmap"]
redis = ["dep:redis"]
compression = ["dep:lz4_flex"]

[[bench]]
name = "memory_store_bench"
harness = false
required-features = ["memory"]
