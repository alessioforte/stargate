[package]
name = "lim"
version.workspace = true
authors.workspace = true
description.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.89"
chrono = "0.4.42"
dashmap = "6.1.0"
hashbrown = "0.16.0"
portable-atomic = { version = "1.11.1", features = ["require-cas"] }
quanta = "0.12.6"
rand = "0.9.2"
redis = "0.32.7"
serde = { version = "1.0.228", features = ["derive"] }
store = { path = "../store" }
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "time"] }

[features]
default = []
memory = ["store/memory"]
redis = ["store/redis"]
