[package]
name = "lim"
version.workspace = true
authors.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = { workspace = true }
dashmap = { workspace = true }
jiff = { workspace = true, default-features = false, features = ["std", "tzdb-bundle-always"] }
rand = { workspace = true }
# Redis is only used by the `redis` backend; edge builds must not compile it.
redis = { workspace = true, optional = true, features = [
    "tokio-rustls-comp",
    "tls-rustls-webpki-roots",
    "connection-manager",
] }
serde = { workspace = true }
store = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }

[features]
default = []
memory = ["store/memory"]
redis = ["dep:redis", "store/redis"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
ulid = { workspace = true }
