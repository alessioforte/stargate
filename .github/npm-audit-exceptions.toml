# npm audit exceptions, read by `.github/scripts/check-npm-audit.py` in CI and
# locally. Every exception needs a reason and a condition for removing it, and
# covers development dependencies only (`dev: true` in the app's lockfile): an
# advisory in code that ships is fixed, never ignored.
#
# Add an exception by appending an [[ignore]] entry:
#
#   id           GHSA identifier, as it appears in the advisory URL
#   apps         the directories under apps/ the advisory affects
#   reason       why the advisory cannot reach a served artifact
#   remove_when  the change that makes the exception unnecessary
#   review_by    last day it is accepted (YYYY-MM-DD, unquoted); CI fails after
#
# An exception that no longer matches an advisory in a listed app fails the
# check too, so expired ones are removed instead of lingering.
#
# Run the check from the repository root: on one app, or on all of them.
#
#   python3 -I .github/scripts/check-npm-audit.py apps/auth
#   for app in apps/*/; do python3 -I .github/scripts/check-npm-audit.py "$app"; done
#
# Moderate and low advisories are reviewed by hand, as before.
