name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  build-test:
    name: build & test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # edge = sqlite + memory, cluster = postgres + redis.
        # The two backends are mutually exclusive, so each profile is built
        # in isolation with --no-default-features.
        profile: [edge, cluster]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}
      # Build and test deny rustc warnings (dead_code, unused, etc.) so
      # regressions of the INFO-1 class fail CI. Clippy's style lints are not
      # yet clean workspace-wide, so the clippy step stays informational for
      # now (see the audit doc, Task 4.1 follow-up).
      - name: Build
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --workspace --no-default-features --features ${{ matrix.profile }}
      - name: Test
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --workspace --no-default-features --features ${{ matrix.profile }}
      - name: Clippy (informational)
        run: cargo clippy --workspace --all-targets --no-default-features --features ${{ matrix.profile }}
