name: OIDC conformance

# Runs the OpenID Foundation conformance suite against a local Stargate. These
# results cannot be used for certification (that requires the hosted suite);
# they catch regressions in the OpenID Provider. See docs/oidc-conformance.md.

on:
  push:
    branches: [main]
    paths:
      - "crates/jwt/**"
      - "crates/oidc/**"
      - "src/api/oidc/**"
      - "src/etc/auth/**"
      - "src/act/sessions.rs"
      - "src/act/backchannel_logout.rs"
      - "src/api/account/login.rs"
      - "src/api/account/logout.rs"
      - "src/api/account/session.rs"
      - "src/fun/build_jwt_cookie.rs"
      - "src/api/auth_app.rs"
      - "apps/auth/**"
      - "migrations/**"
      - "Cargo.lock"
      - ".github/oidc-conformance/**"
      - ".github/workflows/oidc-conformance.yml"
  pull_request:
    paths:
      - "crates/jwt/**"
      - "crates/oidc/**"
      - "src/api/oidc/**"
      - "src/etc/auth/**"
      - "src/act/sessions.rs"
      - "src/act/backchannel_logout.rs"
      - "src/api/account/login.rs"
      - "src/api/account/logout.rs"
      - "src/api/account/session.rs"
      - "src/fun/build_jwt_cookie.rs"
      - "src/api/auth_app.rs"
      - "apps/auth/**"
      - "migrations/**"
      - "Cargo.lock"
      - ".github/oidc-conformance/**"
      - ".github/workflows/oidc-conformance.yml"
  workflow_dispatch:

concurrency:
  group: oidc-conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Prebuilt suite images are kept for recent releases only; bump when the
  # pinned tag disappears from registry.gitlab.com/openid/conformance-suite.
  SUITE_VERSION: release-v5.3.2
  # Local suite: dev mode needs no API token. The hostname resolves to 127.0.0.1.
  CONFORMANCE_SERVER: https://localhost.emobix.co.uk:8443/
  CONFORMANCE_DEV_MODE: "1"
  # Test user the suite's browser signs in as (Basic OP plan).
  OIDC_TEST_USERNAME: oidc-tester@example.com
  OIDC_TEST_PASSWORD: Blue-Harbor-7319!

jobs:
  conformance:
    name: Config, Basic, and logout OP plans
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-01; no versioned releases)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: oidc-conformance

      # Stargate delivers back-channel logout tokens to the suite over TLS and
      # verifies its certificate: a test CA signs one with the suite's
      # hostname, which the override mounts into the suite's nginx.
      - name: Create suite TLS certificate
        run: |
          dir="$RUNNER_TEMP/suite-tls"
          mkdir -p "$dir" && cd "$dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=Conformance test CA" \
            -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign" \
            -keyout ca.key -out ca.crt
          openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost.emobix.co.uk" \
            -keyout suite.key -out suite.csr
          printf 'subjectAltName=DNS:localhost.emobix.co.uk\nextendedKeyUsage=serverAuth\nbasicConstraints=critical,CA:FALSE\n' > ext.cnf
          openssl x509 -req -in suite.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 1 \
            -extfile ext.cnf -out suite.crt
          chmod 644 suite.key
          echo "SUITE_TLS_DIR=$dir" >> "$GITHUB_ENV"

      - name: Start conformance suite
        run: |
          git clone --quiet --depth 1 --branch "$SUITE_VERSION" \
            https://gitlab.com/openid/conformance-suite.git "$RUNNER_TEMP/conformance-suite"
          # The override maps stargate.local to the runner, where Stargate listens,
          # and serves the suite with the certificate created above.
          IMAGE_TAG="$SUITE_VERSION" docker compose --project-name oidc-conformance \
            -f "$RUNNER_TEMP/conformance-suite/docker-compose-prebuilt.yml" \
            -f .github/oidc-conformance/compose.override.yml \
            up -d --quiet-pull

      - name: Build Stargate (edge)
        run: cargo build --no-default-features --features edge

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: apps/auth/package-lock.json

      # The suite's browser signs in on the hosted login page. Its build
      # prerenders the page so the form works without JavaScript (HtmlUnit
      # cannot run the app's ES module bundle). Same-origin API: no VITE_API_URL.
      - name: Build auth app
        working-directory: apps/auth
        run: |
          npm ci
          VITE_API_URL= npm run build

      - name: Start Stargate with TLS
        # The suite requires every discovered endpoint to use HTTPS; it accepts
        # self-signed certificates. Runs from a scratch directory so the edge
        # profile's .stargate state stays out of the checkout. The seeded config
        # relaxes the per-IP rate limit, and MFA is off so the suite's browser
        # signs in with a password only.
        run: |
          mkdir -p "$RUNNER_TEMP/stargate/.stargate" "$RUNNER_TEMP/results"
          cd "$RUNNER_TEMP/stargate"
          cp "$GITHUB_WORKSPACE/.github/oidc-conformance/stargate-config.yaml" .stargate/config.yaml
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=stargate.local" \
            -addext "subjectAltName=DNS:stargate.local" -keyout key.pem -out cert.pem
          export TLS_ENABLED=true TLS_CERT="$PWD/cert.pem" TLS_KEY="$PWD/key.pem" PORT=5443 \
            JWT_ISSUER=https://stargate.local:5443 MFA_MODE=off \
            AUTH_APP_DIR="$GITHUB_WORKSPACE/.stargate/apps/auth" \
            BACKCHANNEL_LOGOUT_CA_FILE="$SUITE_TLS_DIR/ca.crt" \
            LOG_FILE_ENABLED=false LOG_CONSOLE_ENABLED=true
          "$GITHUB_WORKSPACE/target/debug/stargate" admin bootstrap \
            --email "$OIDC_TEST_USERNAME" --password "$OIDC_TEST_PASSWORD" \
            --name "Oidc Tester" --nickname tester
          nohup "$GITHUB_WORKSPACE/target/debug/stargate" > "$RUNNER_TEMP/results/stargate.log" 2>&1 &
          timeout 60 bash -c 'until curl -skf https://127.0.0.1:5443/readyz >/dev/null; do sleep 1; done'

      - name: Wait for conformance suite
        run: |
          for _ in $(seq 100); do
            curl -skf "${CONFORMANCE_SERVER}api/runner/available" >/dev/null && exit 0
            sleep 3
          done
          echo "Conformance suite did not become available" >&2
          exit 1

      - name: Install suite runner dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r "$RUNNER_TEMP/conformance-suite/scripts/requirements.txt"

      # Discovery metadata and JWKS. Fails on any unexpected failure or warning.
      - name: Run Config OP plan
        run: |
          "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/conformance-suite/scripts/run-test-plan.py" \
            --verbose --export-dir "$RUNNER_TEMP/results" \
            oidcc-config-certification-test-plan .github/oidc-conformance/config-op.json

      # Full Authorization Code logins through the suite's headless browser.
      # REVIEW results (screenshots for certification) are not failures here.
      # The configuration (static clients, browser scripts) also serves the
      # logout plans below.
      - name: Run Basic OP plan
        run: |
          API_URL=https://127.0.0.1:5443 .github/oidc-conformance/op-setup.sh \
            https://stargate.local:5443 "$OIDC_TEST_USERNAME" "$OIDC_TEST_PASSWORD" \
            "$RUNNER_TEMP/op.json"
          "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/conformance-suite/scripts/run-test-plan.py" \
            --verbose --export-dir "$RUNNER_TEMP/results" \
            --expected-failures-file .github/oidc-conformance/basic-op-expected-failures.json \
            --expected-skips-file .github/oidc-conformance/basic-op-expected-skips.json \
            "oidcc-basic-certification-test-plan[server_metadata=discovery][client_registration=static_client]" \
            "$RUNNER_TEMP/op.json"

      # end_session_endpoint: logout with and without id_token_hint, the
      # confirmation page, signed-out page, and error pages (REVIEW screenshots).
      - name: Run RP-Initiated Logout OP plan
        run: |
          "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/conformance-suite/scripts/run-test-plan.py" \
            --verbose --export-dir "$RUNNER_TEMP/results" \
            "oidcc-rp-initiated-logout-certification-test-plan[response_type=code][client_registration=static_client]" \
            "$RUNNER_TEMP/op.json"

      # Logout tokens delivered to the suite's backchannel_logout_uri.
      - name: Run Back-Channel Logout OP plan
        run: |
          "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/conformance-suite/scripts/run-test-plan.py" \
            --verbose --export-dir "$RUNNER_TEMP/results" \
            "oidcc-backchannel-rp-initiated-logout-certification-test-plan[response_type=code][client_registration=static_client]" \
            "$RUNNER_TEMP/op.json"

      - name: Collect suite logs
        if: always()
        run: docker logs oidc-conformance-server-1 > "$RUNNER_TEMP/results/suite-server.log" 2>&1 || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: oidc-conformance-results
          path: ${{ runner.temp }}/results
          if-no-files-found: warn
