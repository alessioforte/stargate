name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate without publishing artifacts or a release
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      PLATFORMS: linux/amd64,linux/arm64
      CHART_PATH: k8s/stargate
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release version
        id: release
        run: |
          python3 - <<'PY'
          import os, re, tomllib

          with open("Cargo.toml", "rb") as file:
              manifest = tomllib.load(file)
          workspace_version = manifest["workspace"]["package"]["version"]
          package_version = manifest["package"]["version"]
          if package_version != workspace_version and package_version != {"workspace": True}:
              raise SystemExit("Root package version must match workspace.package.version")
          if os.environ["DRY_RUN"] == "true":
              version = workspace_version
          else:
              if not os.environ["GITHUB_REF"].startswith("refs/tags/v"):
                  raise SystemExit("Publishing requires a v<version> tag; use dry_run on branches")
              version = os.environ["GITHUB_REF_NAME"][1:]
          if version != workspace_version:
              raise SystemExit(f"Tag version {version} != workspace version {workspace_version}")
          # Build metadata (+...) cannot be represented in a Docker tag.
          pattern = r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?"
          match = re.fullmatch(pattern, version)
          if not match or len(version) > 128:
              raise SystemExit("Use SemVer X.Y.Z[-prerelease] without build metadata, at most 128 characters")
          if match[4] and any(part.isdigit() and len(part) > 1 and part[0] == "0" for part in match[4].split(".")):
              raise SystemExit("Numeric prerelease identifiers must not have leading zeroes")
          with open(os.environ["GITHUB_ENV"], "a") as file:
              file.write(f"VERSION={version}\n")
          PY
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/$OWNER/stargate" >> "$GITHUB_ENV"
          echo "CHART_REGISTRY=oci://ghcr.io/$OWNER/charts" >> "$GITHUB_ENV"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Refuse existing image or chart versions
        if: env.DRY_RUN != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request

          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()
          version = os.environ["VERSION"]
          credentials = base64.b64encode(f'{os.environ["GITHUB_ACTOR"]}:{os.environ["GITHUB_TOKEN"]}'.encode()).decode()
          accept = ", ".join([
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.docker.distribution.manifest.v2+json",
          ])
          for repository in (f"{owner}/stargate", f"{owner}/charts/stargate"):
              query = urllib.parse.urlencode({"service": "ghcr.io", "scope": f"repository:{repository}:pull,push"})
              request = urllib.request.Request(f"https://ghcr.io/token?{query}", headers={"Authorization": f"Basic {credentials}"})
              # Authentication/network failures must stop the release, not imply absence.
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = json.load(response)["token"]
              request = urllib.request.Request(
                  f"https://ghcr.io/v2/{repository}/manifests/{version}",
                  headers={"Authorization": f"Bearer {token}", "Accept": accept},
                  method="HEAD",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30):
                      pass
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      continue
                  raise SystemExit(f"Cannot verify ghcr.io/{repository}:{version}: HTTP {error.code}")
              raise SystemExit(f"Already published: ghcr.io/{repository}:{version}; choose a new version")
          PY

      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      - name: Lint, package, and render chart
        run: |
          helm lint "$CHART_PATH"
          helm package "$CHART_PATH" --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP/chart"
          helm template stargate "$RUNNER_TEMP/chart/stargate-$VERSION.tgz" > "$RUNNER_TEMP/chart/rendered.yaml"
          grep -Fq "image: \"$IMAGE:$VERSION\"" "$RUNNER_TEMP/chart/rendered.yaml"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          build-args: STARGATE_PROFILE=cluster
          push: ${{ env.DRY_RUN != 'true' }}
          outputs: ${{ env.DRY_RUN == 'true' && format('type=oci,dest={0}/stargate-image.tar', runner.temp) || '' }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.release.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Publish chart
        if: env.DRY_RUN != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart/stargate-$VERSION.tgz" "$CHART_REGISTRY"

      - name: Create GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          printf 'Image: `%s:%s@%s`\n\nChart: `%s/stargate` (version `%s`, appVersion `%s`)\n' \
            "$IMAGE" "$VERSION" "$IMAGE_DIGEST" "$CHART_REGISTRY" "$VERSION" "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
