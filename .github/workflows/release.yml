name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build OCI archives without registry publication or a release
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CHART_PATH: k8s/stargate
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    outputs:
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
      chart_registry: ${{ steps.release.outputs.chart_registry }}
      created: ${{ steps.release.outputs.created }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release version
        id: release
        run: |
          python3 - <<'PY'
          import os, re, tomllib

          with open("Cargo.toml", "rb") as file:
              manifest = tomllib.load(file)
          workspace_version = manifest["workspace"]["package"]["version"]
          package_version = manifest["package"]["version"]
          if package_version != workspace_version and package_version != {"workspace": True}:
              raise SystemExit("Root package version must match workspace.package.version")
          if os.environ["DRY_RUN"] == "true":
              version = workspace_version
          else:
              if not os.environ["GITHUB_REF"].startswith("refs/tags/v"):
                  raise SystemExit("Publishing requires a v<version> tag; use dry_run on branches")
              version = os.environ["GITHUB_REF_NAME"][1:]
          if version != workspace_version:
              raise SystemExit(f"Tag version {version} != workspace version {workspace_version}")
          # Build metadata (+...) cannot be represented in a Docker tag.
          pattern = r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?"
          match = re.fullmatch(pattern, version)
          if not match or len(version) > 128:
              raise SystemExit("Use SemVer X.Y.Z[-prerelease] without build metadata, at most 128 characters")
          if match[4] and any(part.isdigit() and len(part) > 1 and part[0] == "0" for part in match[4].split(".")):
              raise SystemExit("Numeric prerelease identifiers must not have leading zeroes")
          chart = dict(line.split(":", 1) for line in open("k8s/stargate/Chart.yaml") if line.startswith(("version:", "appVersion:")))
          if any(chart[key].strip().strip('"') != version for key in ("version", "appVersion")):
              raise SystemExit("Chart.yaml version and appVersion must match the workspace version")
          with open(os.environ["GITHUB_OUTPUT"], "a") as file:
              file.write(f"version={version}\n")
          with open(os.environ["GITHUB_ENV"], "a") as file:
              file.write(f"VERSION={version}\n")
          PY
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/$OWNER/stargate" >> "$GITHUB_ENV"
          echo "CHART_REGISTRY=oci://ghcr.io/$OWNER/charts" >> "$GITHUB_ENV"
          echo "image=ghcr.io/$OWNER/stargate" >> "$GITHUB_OUTPUT"
          echo "chart_registry=oci://ghcr.io/$OWNER/charts" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Test release image verification
        run: python3 -m unittest discover -s .github/tests

      # The README quickstart pulls the image tag pinned in docker-compose.yml.
      - name: Check quickstart image tag
        run: |
          expected="$IMAGE:\${STARGATE_VERSION:-$VERSION}"
          if ! grep -Fq "$expected" docker-compose.yml; then
            echo "docker-compose.yml must default to $expected" >&2
            exit 1
          fi

      - name: Refuse existing image or chart versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request

          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()
          version = os.environ["VERSION"]
          credentials = base64.b64encode(f'{os.environ["GITHUB_ACTOR"]}:{os.environ["GITHUB_TOKEN"]}'.encode()).decode()
          accept = ", ".join([
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.docker.distribution.manifest.v2+json",
          ])
          for repository in (f"{owner}/stargate", f"{owner}/charts/stargate"):
              query = urllib.parse.urlencode({"service": "ghcr.io", "scope": f"repository:{repository}:pull,push"})
              request = urllib.request.Request(f"https://ghcr.io/token?{query}", headers={"Authorization": f"Basic {credentials}"})
              # Authentication/network failures must stop the release, not imply absence.
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = json.load(response)["token"]
              request = urllib.request.Request(
                  f"https://ghcr.io/v2/{repository}/manifests/{version}",
                  headers={"Authorization": f"Bearer {token}", "Accept": accept},
                  method="HEAD",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30):
                      pass
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      continue
                  raise SystemExit(f"Cannot verify ghcr.io/{repository}:{version}: HTTP {error.code}")
              raise SystemExit(f"Already published: ghcr.io/{repository}:{version}; choose a new version")
          PY

      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      - name: Lint, package, and render chart
        run: |
          helm lint "$CHART_PATH"
          helm package "$CHART_PATH" --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP/chart"
          helm template stargate "$RUNNER_TEMP/chart/stargate-$VERSION.tgz" > "$RUNNER_TEMP/chart/rendered.yaml"
          grep -Fq "image: \"$IMAGE:$VERSION\"" "$RUNNER_TEMP/chart/rendered.yaml"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: STARGATE_PROFILE=cluster
          outputs: ${{ env.DRY_RUN == 'true' && format('type=oci,dest={0}/stargate-{1}.tar', runner.temp, matrix.arch) || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
          cache-from: type=gha,scope=stargate-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=stargate-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Save pushed digest
        if: env.DRY_RUN != 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/digest"

      - name: Upload pushed digest
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest
          if-no-files-found: error
          retention-days: 1

      - name: Upload dry-run OCI image
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-oci-${{ matrix.arch }}
          path: ${{ runner.temp }}/stargate-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: [prepare, build]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
      CHART_REGISTRY: ${{ needs.prepare.outputs.chart_registry }}
      CHART_PATH: k8s/stargate
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download platform digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'image-digest-*' --dir "$RUNNER_TEMP/digests"

      - name: Merge platform images and verify attestations
        id: image
        run: |
          sources=()
          for arch in amd64 arm64; do
            digest="$(cat "$RUNNER_TEMP/digests/image-digest-$arch/digest")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid $arch image digest" >&2
              exit 1
            fi
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" \
            --metadata-file "$RUNNER_TEMP/image-metadata.json" "${sources[@]}"
          digest="$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/image-metadata.json")"
          python3 .github/scripts/verify-release-image.py "$IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      - name: Publish chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package "$CHART_PATH" --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP/chart"
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart/stargate-$VERSION.tgz" "$CHART_REGISTRY" 2>&1 | tee "$RUNNER_TEMP/chart-push.log"
          digest="$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/chart-push.log")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "CHART_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          printf 'Image: `%s:%s@%s`\n\nChart: `%s/stargate@%s` (version `%s`, appVersion `%s`)\n' \
            "$IMAGE" "$VERSION" "$IMAGE_DIGEST" "$CHART_REGISTRY" "$CHART_DIGEST" "$VERSION" "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          if [[ -f "docs/releases/$VERSION.md" ]]; then
            printf '\n' >> "$RUNNER_TEMP/release-notes.md"
            cat "docs/releases/$VERSION.md" >> "$RUNNER_TEMP/release-notes.md"
          fi
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
