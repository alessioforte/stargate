name: Redis

# The Redis suites are slow and need disposable containers, so they run only
# when the code they exercise changes, or on demand.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: redis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  REDIS_IMAGE: redis:7.4-alpine
  POSTGRES_IMAGE: postgres:17-alpine

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matched: ${{ steps.diff.outputs.matched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare changed paths
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "matched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          matched=$(python3 -I .github/scripts/changed-paths.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" .github/paths/redis-failures.txt)
          echo "matched=$matched" >> "$GITHUB_OUTPUT"

  redis:
    name: Redis suites and failures
    needs: changes
    if: needs.changes.outputs.matched == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-01; no versioned releases)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: redis-failures
      - name: Build the cluster profile
        run: cargo build --no-default-features --features cluster
      # test_redis_prefix.py reruns the ignored tests with --offline; build
      # their targets first so the registry cache is complete.
      - name: Build the Redis test binaries
        run: >-
          cargo test -p store -p lim --locked --features redis
          --test redis_prefix --test redis_cluster --no-run
      - name: Prefix, ACL and session smoke test
        run: >-
          python3 benches/scripts/test_redis_prefix.py
          --redis-image "$REDIS_IMAGE" --postgres-image "$POSTGRES_IMAGE"
      - name: Redis Cluster store and limiter suites
        run: >-
          python3 benches/scripts/test_redis_cluster.py
          --redis-image "$REDIS_IMAGE"
      - name: Failure bench
        run: >-
          python3 benches/scripts/redis_failures.py
          --redis-image "$REDIS_IMAGE" --postgres-image "$POSTGRES_IMAGE"
      - name: Round trip cap check self-test
        run: python3 benches/scripts/test_benchmark_request_paths.py
      - name: Request path Redis round trips
        run: >-
          python3 benches/scripts/benchmark_request_paths.py
          --seconds 1 --workers 4 --check-round-trips
          --output "$RUNNER_TEMP/request-path-round-trips.json"

  # The required check: it runs on every pull request and reports the suites'
  # result, or success when the changed paths did not need them.
  summary:
    name: Redis suites
    needs: [changes, redis]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the Redis jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          REDIS: ${{ needs.redis.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "Path detection failed: $CHANGES" >&2
            exit 1
          fi
          case "$REDIS" in
            success|skipped) echo "Redis suites: $REDIS" ;;
            *) echo "Redis suites did not pass: $REDIS" >&2; exit 1 ;;
          esac
