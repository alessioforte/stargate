{{- if and .Values.traefik.enabled .Values.traefik.adminAllowList.enabled }}
{{- include "stargate.validateValues" . -}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "stargate.adminAllowListName" . }}
  labels:
    {{- include "stargate.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      {{- range .Values.traefik.adminAllowList.sourceRange }}
      - {{ . | quote }}
      {{- end }}
    {{- if gt (int .Values.traefik.adminAllowList.ipStrategyDepth) 0 }}
    ipStrategy:
      depth: {{ .Values.traefik.adminAllowList.ipStrategyDepth }}
    {{- end }}
{{- end }}
