apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test-connection" (include "stargate.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "stargate.testLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
      command:
        - wget
      args:
        - --quiet
        - --timeout=10
        - --tries=1
        - --spider
        - http://{{ include "stargate.fullname" . }}:{{ .Values.service.port }}/readyz
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
