{{- if .Values.gatewayConfig.importOnUpgrade }}
{{- include "stargate.validateValues" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "stargate.configImportName" . }}
  labels:
    {{- include "stargate.configImportLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "stargate.configImportLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "stargate.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: config-import
          image: {{ include "stargate.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              /bin/server config import --kind gateway --file "$STARGATE_IMPORT_GATEWAY_FILE"
              /bin/server config import --kind policies --file "$STARGATE_IMPORT_POLICIES_FILE"
          env:
            - name: STARGATE_RUNTIME_PROFILE
              value: {{ .Values.deployment.mode | quote }}
            {{- if .Values.migrations.job.enabled }}
            - name: DB_MIGRATE_ON_START
              value: "false"
            {{- end }}
            - name: STARGATE_IMPORT_GATEWAY_FILE
              value: {{ printf "%s/%s" .Values.gatewayConfig.mountPath .Values.gatewayConfig.fileName | quote }}
            - name: STARGATE_IMPORT_POLICIES_FILE
              value: {{ printf "%s/%s" .Values.gatewayConfig.mountPath .Values.gatewayConfig.policiesFileName | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "stargate.runtimeConfigName" . }}
            {{- if or .Values.runtimeSecret.create .Values.runtimeSecret.existingSecret }}
            - secretRef:
                name: {{ include "stargate.runtimeSecretName" . }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: gateway-config
              mountPath: {{ .Values.gatewayConfig.mountPath }}
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: gateway-config
          configMap:
            name: {{ include "stargate.gatewayConfigName" . }}
            defaultMode: 0444
            items:
              - key: {{ .Values.gatewayConfig.fileName }}
                path: {{ .Values.gatewayConfig.fileName }}
              - key: {{ .Values.gatewayConfig.policiesFileName }}
                path: {{ .Values.gatewayConfig.policiesFileName }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
