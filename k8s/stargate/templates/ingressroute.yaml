{{- if .Values.traefik.enabled }}
{{- include "stargate.validateValues" . -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "stargate.fullname" . }}
  labels:
    {{- include "stargate.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.traefik.entryPoints | nindent 4 }}
  routes:
    {{- if .Values.traefik.adminAllowList.enabled }}
    - kind: Rule
      match: {{ printf "Host(`%s`) && %s" .Values.traefik.identityHost (include "stargate.adminPathRule" .) | quote }}
      priority: 30
      middlewares:
        - name: {{ include "stargate.adminAllowListName" . }}
      services:
        {{- include "stargate.ingressRouteService" (dict "root" . "scheme" "http") | nindent 8 }}
    {{- end }}
    - kind: Rule
      {{- if .Values.traefik.adminAllowList.enabled }}
      match: {{ printf "Host(`%s`) && !%s" .Values.traefik.identityHost (include "stargate.adminPathRule" .) | quote }}
      {{- else }}
      match: {{ printf "Host(`%s`)" .Values.traefik.identityHost | quote }}
      {{- end }}
      priority: 10
      services:
        {{- include "stargate.ingressRouteService" (dict "root" . "scheme" "http") | nindent 8 }}
    {{- if .Values.traefik.apiHosts }}
    {{- $matches := list }}
    {{- range .Values.traefik.apiHosts }}
      {{- $matches = append $matches (printf "Host(`%s`)" .) }}
    {{- end }}
    - kind: Rule
      match: {{ join " || " $matches | quote }}
      priority: 10
      services:
        {{- include "stargate.ingressRouteService" (dict "root" . "scheme" "http") | nindent 8 }}
    {{- end }}
    {{- if .Values.traefik.grpc.enabled }}
    {{- range .Values.traefik.apiHosts }}
    - kind: Rule
      match: {{ printf "Host(`%s`) && HeaderRegexp(`Content-Type`, `^application/grpc`)" . | quote }}
      priority: 20
      services:
        {{- include "stargate.ingressRouteService" (dict "root" $ "scheme" "h2c") | nindent 8 }}
    {{- end }}
    {{- end }}
  {{- if or .Values.traefik.tls.secretName .Values.traefik.tls.certResolver }}
  tls:
    {{- with .Values.traefik.tls.secretName }}
    secretName: {{ . | quote }}
    {{- end }}
    {{- with .Values.traefik.tls.certResolver }}
    certResolver: {{ . | quote }}
    {{- end }}
  {{- else }}
  tls: {}
  {{- end }}
{{- end }}
