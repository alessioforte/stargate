{{- if .Values.runtimeConfig.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stargate.runtimeConfigName" . }}
  labels:
    {{- include "stargate.labels" . | nindent 4 }}
  {{- with .Values.runtimeConfig.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- include "stargate.runtimeConfigData" . | nindent 2 }}
{{- end }}
