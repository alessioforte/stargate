# Stargate Helm values.
#
# `edge` is a single-replica SQLite + in-memory deployment. `cluster` requires
# an image compiled with STARGATE_PROFILE=cluster and shared PostgreSQL + Redis.
deployment:
  mode: edge
  annotations: {}
  revisionHistoryLimit: 5
  minReadySeconds: 0
  strategy:
    # Empty selects Recreate for edge and RollingUpdate for cluster.
    type: ""
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0

replicaCount: 1

image:
  repository: stargate
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
commonLabels: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

containerPort: 5050
terminationGracePeriodSeconds: 40

service:
  type: ClusterIP
  port: 5050
  annotations: {}
  sessionAffinity: None

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: stargate.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

probes:
  # Initialization finishes before the listener opens. Liveness has no SQL,
  # Redis, auth, or rate-limiter dependencies; readiness checks SQL and Redis.
  startup:
    enabled: true
    httpGet:
      path: /livez
      port: http
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  liveness:
    enabled: true
    httpGet:
      path: /livez
      port: http
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null
  behavior: {}

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

# Non-confidential environment variables. Sensitive keys are rejected here;
# put them in runtimeSecret instead.
runtimeConfig:
  create: true
  existingConfigMap: ""
  rolloutToken: ""
  annotations: {}
  data:
    LOG_FILE_ENABLED: "false"
    JWT_ALGORITHM: HS256

# Prefer an externally managed Secret in production. `stringData` exists for
# local development and is retained in Helm release history.
runtimeSecret:
  create: false
  existingSecret: ""
  rolloutToken: ""
  annotations: {}
  stringData: {}

# Stargate requires both files at startup. An existing ConfigMap must contain
# keys matching `fileName` and `policiesFileName`.
gatewayConfig:
  create: true
  existingConfigMap: ""
  rolloutToken: ""
  annotations: {}
  mountPath: /etc/stargate
  fileName: config.yaml
  policiesFileName: policies
  config: |
    schema: stargate/v1
    # Process capacities in runtime require a pod restart; deadlines can reload.
    runtime: {}
  policies: ""

# Edge-only state. No static PersistentVolume is created: a PVC uses the
# cluster's default or selected StorageClass. The seed init container copies
# the Console, Auth UI, and mail assets into a new/existing claim.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}
  mountPath: /app/.stargate
  seed:
    enabled: true

# Idempotent first-admin and Console OAuth-client provisioning. The password
# must be supplied by an existing Secret; it is never accepted in values.
bootstrap:
  enabled: false
  email: ""
  name: Stargate Admin
  nickname: stargate-admin
  oauthClientId: stargate_console
  oauthRedirectUri: ""
  existingSecret: ""
  passwordKey: password
  rolloutToken: ""
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: null
  annotations: {}
  podAnnotations: {}

command: []
args: []
lifecycle: {}
extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []

priorityClassName: ""
runtimeClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
