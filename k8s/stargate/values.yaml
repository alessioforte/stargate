# Default values for stargate.
# This chart defaults to the "edge" profile:
# - single replica
# - local sqlite + in-process memory state is acceptable
# - intended for Raspberry Pi, edge, and other single-node deployments
#
# Switch to "cluster" only when you are using an image/runtime configured for
# shared backends and you provide shared state services such as Redis/Postgres.
deployment:
  mode: edge

replicaCount: 1

image:
  repository: stargate
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

terminationGracePeriodSeconds: 40

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # type: ClusterIP
  type: LoadBalancer
  port: 5050

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: stargate.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

persistentVolume:
  enabled: true
  accessModes:
    - ReadWriteOnce

persistentVolumeClaim:
  enabled: true
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

volumes:
  - name: stargate-pv
    persistentVolumeClaim:
      claimName: stargate-pvc

volumeMounts:
  - mountPath: /.stargate
    name: stargate-pv

configmap:
  enabled: true
  name: stargate-config
  data:
    # Cluster profile expects shared backends to be provided here.
    # SERVER_SHUTDOWN_TIMEOUT_SECS: "25"
    # AUDIT_MAX_PENDING: "1024"
    # REDIS_URL: redis://redis.default.svc.cluster.local:6379
    # POSTGRES_ENDPOINT: postgres.default.svc.cluster.local
    # POSTGRES_DATABASE: stargate
    # POSTGRES_USERNAME: stargate
    # POSTGRES_PASSWORD: change-me
    # SURREALDB_ENDPOINT: http://surrealdb-tikv.default.svc.cluster.local:8000

livenessProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
readinessProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
