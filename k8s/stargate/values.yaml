# Stargate Helm values.
#
# `edge` is a single-replica SQLite + in-memory deployment. `cluster` requires
# an image compiled with STARGATE_PROFILE=cluster and shared PostgreSQL + Redis.
deployment:
  mode: edge
  annotations: {}
  revisionHistoryLimit: 5
  minReadySeconds: 0
  strategy:
    # Empty selects Recreate for edge and RollingUpdate for cluster.
    type: ""
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0

replicaCount: 1

image:
  repository: ghcr.io/alessioforte/stargate
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
commonLabels: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

containerPort: 5050
terminationGracePeriodSeconds: 40

service:
  type: ClusterIP
  port: 5050
  annotations: {}
  sessionAffinity: None

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: stargate.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

probes:
  # Initialization finishes before the listener opens. Liveness has no SQL,
  # Redis, auth, or rate-limiter dependencies; readiness checks SQL and Redis.
  startup:
    enabled: true
    httpGet:
      path: /livez
      port: http
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  liveness:
    enabled: true
    httpGet:
      path: /livez
      port: http
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null
  behavior: {}

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

# Non-confidential environment variables. Sensitive keys are rejected here;
# put them in runtimeSecret instead.
runtimeConfig:
  create: true
  existingConfigMap: ""
  rolloutToken: ""
  annotations: {}
  data:
    LOG_FORMAT: json

# JWT signing keys. Edge keeps them on the PVC (generated as RS256 on first
# start; rotate with `stargate jwt generate-key` in the pod). Cluster replicas
# must share them: create one Secret per key from the directory written by
# `stargate jwt generate-key` (private.pem, public.pem, alg) and list it in
# `keys`. Each Secret is mounted read-only at .stargate/jwks/keys/<kid>/.
jwt:
  # Signing key (JWT_KID). Required in cluster mode unless JWT_ALGORITHM is HS*.
  activeKid: ""
  # Optional RS256 key that signs only OIDC ID tokens (JWT_ID_TOKEN_KID), for
  # an ES256 or HMAC active key.
  idTokenKid: ""
  # Cluster only. Keys other than activeKid/idTokenKid only verify: the next
  # key before activation and retired keys until their tokens expire.
  keys: []
  #  - kid: stargate-2026-10
  #    secretName: stargate-jwt-2026-10

# Prefer an externally managed Secret in production. `stringData` exists for
# local development and is retained in Helm release history.
runtimeSecret:
  create: false
  existingSecret: ""
  rolloutToken: ""
  annotations: {}
  stringData: {}

# Read-only seed files, used only when the corresponding database document is absent.
# An existing ConfigMap must contain keys matching `fileName` and `policiesFileName`.
gatewayConfig:
  create: true
  # Cluster only: import both documents after every install/upgrade, overwriting Console edits.
  # Edge imports must run inside the existing pod with kubectl exec.
  importOnUpgrade: false
  existingConfigMap: ""
  annotations: {}
  mountPath: /etc/stargate
  fileName: config.yaml
  policiesFileName: policies
  config: |
    schema: stargate/v1
    ingress:
      limit: ingress
      timeout: 250ms
    limits:
      default:
        strategy: gcra
        params:
          max_burst: 100
          replenish_1_per: 1s
      ingress:
        strategy: gcra
        params:
          max_burst: 100
          replenish_1_per: 100ms
    # Process capacities in runtime require a pod restart; deadlines can reload.
    runtime: {}
  policies: ""

# Edge-only state. No static PersistentVolume is created: a PVC uses the
# cluster's default or selected StorageClass. The seed init container copies
# the Console, Auth UI, and mail assets into a new/existing claim.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}
  mountPath: /app/.stargate
  seed:
    enabled: true

# Idempotent first-admin and Console OAuth-client provisioning. The password
# must be supplied by an existing Secret; it is never accepted in values.
bootstrap:
  enabled: false
  email: ""
  name: Stargate Admin
  nickname: stargate-admin
  oauthClientId: stargate_console
  oauthRedirectUri: ""
  existingSecret: ""
  passwordKey: password
  rolloutToken: ""
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: null
  annotations: {}
  podAnnotations: {}

command: []
args: []
lifecycle: {}
extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []

priorityClassName: ""
runtimeClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
