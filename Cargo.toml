[package]
name = "stargate"
version = "0.1.0"
description = "A powerful API gateway and IAM server built in Rust."
authors = ["Alessio Forte <fortealessio@gmail.com>"]
edition = "2024"
license = "MIT"
readme = "README.md"

[workspace.package]
version = "0.1.0"
authors = ["Alessio Forte <fortealessio@gmail.com>"]
edition = "2024"
license = "MIT"
readme = "README.md"

[workspace]
members = [
    ".",
    "crates/ace",
    "crates/ctx",
    "crates/db",
    "crates/gate",
    "crates/idp",
    "crates/jwt",
    "crates/lb",
    "crates/lim",
    "crates/oidc",
    "crates/otp",
    "crates/pw",
    "crates/smtp",
    "crates/store",
    "crates/tools"
]

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false
opt-level = 2

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# [profile.release]
# lto = true
# codegen-units = 1
# panic = "abort"

[package.metadata.release]
tag-message = "chore: :bookmark: Release `{{crate_name}}` version {{version}}"
publish = false
push = false

[dependencies]
ace = { path = "crates/ace" }
ctx = { path = "crates/ctx" }
http = "1"
axum = { version = "0.8", features = ["macros"] }
hyper = { version = "1.11", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.27.9", features = ["http1", "http2", "ring", "webpki-tokio"] }
hyper-tungstenite = { version = "0.30" }
http-body-util = { version = "0.1" }
tokio-rustls = { version = "0.26", features = ["ring"] }
tokio-tungstenite = { version = "0.30", features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34" }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "compression-gzip", "fs", "trace", "normalize-path"] }
utoipa-axum = { version = "0.2" }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
db = { path = "crates/db" }
chrono = "0.4.45"
dotenvy = "0.15.7"
gate = { path = "crates/gate" }
hex = "0.4.3"
jwt = { path = "crates/jwt" }
lb = { path = "crates/lb" }
mime = "0.3.17"
idp = { path = "crates/idp" }
oidc = { path = "crates/oidc" }
otp = { path = "crates/otp" }
pw = { path = "crates/pw" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smtp = { path = "crates/smtp" }
store = { path = "crates/store" }
thiserror = "2.0.20"
tools = { path = "crates/tools" }
utoipa = { version = "5.5.0", features = ["axum_extras", "yaml"] }
once_cell = "1.21.4"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
rustls = "0.23.43"
rustls-pemfile = "2.2.0"
anyhow = "1.0.104"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs", "http-proto", "reqwest-client", "grpc-tonic", "tls-ring"] }
opentelemetry-appender-tracing = "0.32"
tracing-opentelemetry = "0.33"
base64 = "0.23.1"
rsa = "0.9.10"
sha2 = "0.11.0"
url = "2.5.8"
ulid = "3.0.0"
lim = { path = "crates/lim" }
lru = "0.18"
maxminddb = { version = "0.30.3", features = ["simdutf8"] }
moka = { version = "0.12.16", features = ["sync"] }
notify = "8.2.0"
clap = { version = "4.6.6", features = ["derive"] }

[features]
# No default profile: the `edge` and `cluster` backends are mutually
# exclusive, so a default would silently combine with an explicitly requested
# profile and fail to compile. Always build with exactly one profile, e.g.
# `cargo run --features edge` or `cargo build --release --features cluster`.
default = []
edge = ["sqlite", "memory"]
cluster = ["postgres", "redis"]
postgres = ["db/postgres"]
sqlite = ["db/sqlite"]
memory = ["store/memory", "gate/memory", "oidc/memory", "lim/memory"]
redis = ["store/redis", "gate/redis", "lim/redis"]
redis-compression = ["store/compression"]

[dev-dependencies]
redis = { version = "1.6.0", features = ["tokio-comp"] }
