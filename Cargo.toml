[package]
name = "stargate"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# [profile.release]
# lto = true
# codegen-units = 1
# panic = "abort"

[dependencies]
actix = "0.13.5"
actix-cors = "0.7.0"
actix-files = "0.6.6"
actix-governor = "0.8.0"
actix-http = "3.9.0"
actix-session = { version = "0.10.0", features = ["cookie-session"] }
actix-utils = "3.0.1"
actix-web = { version = "4.9.0", features = ["rustls-0_23"] }
actix-web-grants = "4.1.2"
actix-web-httpauth = "0.8.2"
actix-web-lab = "0.23.0"
actix-ws = "0.3.0"
actix-ws-proxy = "0.1.2"
argon2 = "0.5.3"
async-recursion = "1.1.1"
awc = { version = "3.5.1", features = ["openssl"] }
bytes = "1.10.0"
chrono = "0.4.40"
dotenvy = "0.15.7"
futures = "0.3.31"
futures-util = "0.3.31"
handlebars = "6.3.1"
jsonwebtoken = "9.3.1"
lettre = "0.11.14"
log = "0.4.26"
mime = "0.3.17"
notify-debouncer-mini = "0.6.0"
once_cell = "1.20.3"
pretty_env_logger = "0.5.0"
rand = "0.9.0"
rustls = "0.23.23"
rustls-pemfile = "2.1.3"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
serde_yml = "0.0.12"
surrealdb = { version = "2.2.1", features = [
    "http",
    "kv-surrealkv",
    "protocol-http",
] }
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }
url = "2.5.4"
utoipa = { version = "5.3.1", features = ["actix_extras", "yaml"] }
uuid = { version = "1.15.1", features = ["v4"] }
