[package]
name = "stargate"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-cors = "0.7.0"
actix-files = "0.6.6"
actix-governor = "0.5.0"
actix-utils = "3.0.1"
actix-web = "4.8.0"
actix-web-grants = "4.1.1"
actix-web-httpauth = "0.8.2"
actix-web-lab = "0.20.2"
argon2 = "0.5.3"
chrono = "0.4.38"
dotenvy = "0.15.7"
futures = "0.3.30"
futures-util = "0.3.30"
jsonwebtoken = "9.3.0"
lettre = "0.11.7"
log = "0.4.22"
mime = "0.3.17"
once_cell = "1.19.0"
pin-project = "1.1.5"
pretty_env_logger = "0.5.0"
rand = "0.8.5"
redis = "0.25.4"
reqwest = { version = "0.12.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.118"
serde_yaml = "0.9.34"
surrealdb = { version = "1.5.3", features = ["http", "protocol-http", "kv-rocksdb"] }
thiserror = "1.0.61"
tokio = { version = "1.38.0", features = ["macros", "rt-multi-thread"] }
utoipa = { version = "4.2.3", features = ["actix_extras", "yaml"] }
uuid = { version = "1.9.1", features = ["v4"] }
