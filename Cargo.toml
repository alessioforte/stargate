[package]
name = "stargate"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-cors = "0.7.0"
actix-governor = "0.5.0"
actix-utils = "3.0.1"
actix-web = "4.5.1"
actix-web-httpauth = "0.8.1"
actix-web-lab = "0.20.2"
argon2 = "0.5.3"
chrono = "0.4.38"
dotenv = "0.15.0"
env_logger = "0.11.3"
futures = "0.3.30"
futures-util = "0.3.30"
jsonwebtoken = "9.3.0"
lettre = "0.11.6"
log = "0.4.21"
once_cell = "1.19.0"
pin-project = "1.1.5"
redis = "0.25.3"
reqwest = "0.12.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.115"
serde_yaml = "0.9.34"
surrealdb = { version = "1.4.2", features = ["http", "kv-mem", "protocol-http", "kv-rocksdb"] }
tokio = { version = "1.37.0", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.8.0", features = ["v4"] }
