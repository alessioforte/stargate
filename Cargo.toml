[package]
name = "stargate"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# [profile.release]
# lto = true
# codegen-units = 1
# panic = "abort"

[package.metadata.release]
tag-message = "chore: :bookmark: Release `{{crate_name}}` version {{version}}"
publish = false
push = false

[dependencies]
actix = "0.13.5"
actix-cors = "0.7.1"
actix-files = "0.6.6"
actix-governor = "0.8.0"
actix-http = "3.11.0"
actix-session = { version = "0.10.0", features = ["cookie-session"] }
actix-utils = "3.0.1"
actix-web = { version = "4.11.0", features = ["openssl"] }
actix-web-grants = "4.1.2"
actix-web-httpauth = "0.8.2"
actix-ws = "0.3.0"
actix-ws-proxy = "0.1.2"
argon2 = "0.5.3"
async-recursion = "1.1.1"
awc = { version = "3.7.0", features = ["openssl"] }
chrono = "0.4.41"
dotenvy = "0.15.7"
handlebars = "6.3.2"
jsonwebtoken = "9.3.1"
lettre = "0.11.16"
log = "0.4.27"
mime = "0.3.17"
notify-debouncer-mini = "0.6.0"
once_cell = "1.21.3"
openssl = "0.10.72"
pretty_env_logger = "0.5.0"
rand = "0.9.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yml = "0.0.12"
surrealdb = { version = "2.3.2", features = [
    "http",
    "kv-surrealkv",
    "protocol-http",
] }
thiserror = "2.0.12"
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread"] }
url = "2.5.4"
utoipa = { version = "5.3.1", features = ["actix_extras", "yaml"] }
uuid = { version = "1.16.0", features = ["v4"] }
