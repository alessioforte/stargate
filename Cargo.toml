[workspace]
resolver = "2"
members = [ "crates/db", "crates/gate", "crates/jwt", "crates/oauth", "crates/password", "crates/smtp",
    "crates/stargate"
]

[workspace.package]
version = "0.1.0"
authors = [
    "Alessio Forte <fortealessio@gmail.com>",
]
description = "Stargate API Gateway and IAM"
readme = "README.md"
edition = "2021"
license = "MIT"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false
opt-level = 2
