[package]
name = "stargate"
version = "0.1.1"
description = "A powerful API gateway and IAM server built in Rust."
authors = ["Alessio Forte <fortealessio@gmail.com>"]
edition = "2024"
license = "Elastic-2.0"
readme = "README.md"

[workspace.package]
version = "0.1.1"
authors = ["Alessio Forte <fortealessio@gmail.com>"]
edition = "2024"
license = "Elastic-2.0"
readme = "README.md"

[workspace]
members = [
    ".",
    "crates/ace",
    "crates/ctx",
    "crates/db",
    "crates/gate",
    "crates/idp",
    "crates/jwt",
    "crates/lb",
    "crates/lim",
    "crates/oidc",
    "crates/otp",
    "crates/pw",
    "crates/smtp",
    "crates/store",
    "crates/tools",
]

# Single source of truth for dependency versions; members inherit with
# `{ workspace = true }` and only add the features/defaults they need.
[workspace.dependencies]
# Workspace crates
ace = { path = "crates/ace" }
ctx = { path = "crates/ctx" }
db = { path = "crates/db" }
gate = { path = "crates/gate" }
idp = { path = "crates/idp" }
jwt = { path = "crates/jwt" }
lb = { path = "crates/lb" }
lim = { path = "crates/lim" }
oidc = { path = "crates/oidc" }
otp = { path = "crates/otp" }
pw = { path = "crates/pw" }
smtp = { path = "crates/smtp" }
store = { path = "crates/store" }
tools = { path = "crates/tools" }

# External crates
ahash = "0.8.12"
anyhow = "1.0.104"
arc-swap = "1.9.3"
argon2 = "0.6.0"
async-trait = "0.1.92"
aws-lc-rs = "1.19.0"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false }
clap = "4.6.7"
criterion = "0.8.2"
dashmap = "6.2.1"
dotenvy = "0.15.7"
env_logger = "0.11.11"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = "1.12.0"
hyper-rustls = "0.27.10"
hyper-tungstenite = "0.30.0"
hyper-util = "0.1.21"
indexmap = "2.14.2"
jsonwebtoken = "11.1.0"
lettre = { version = "0.11.23", default-features = false }
lru = "0.19.0"
lz4_flex = "0.14.0"
matchit = "0.9.2"
maxminddb = "0.32.0"
mime = "0.3.17"
moka = "0.12.16"
once_cell = "1.21.4"
opentelemetry = { version = "0.33.1", default-features = false }
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false }
opentelemetry_sdk = { version = "0.33.1", default-features = false }
p256 = "0.14.0"
p384 = "0.14.0"
password-hash = "0.6.1"
pem = "3.0.6"
pkcs8 = "0.11.0"
portable-atomic = "1.15.0"
prost = "0.14.4"
rand = "0.10.3"
rayon = "1.12.0"
redis = "1.8.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false }
rmp-serde = "1.3.1"
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
serde_with = "3.24.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false }
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-rustls = "0.26.6"
tokio-tungstenite = "0.30.0"
tokio-util = "0.7.20"
tonic = "0.14.9"
tonic-health = "0.14.9"
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", default-features = false }
ulid = "3.0.0"
url = "2.5.8"
utoipa = "6.0.0"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false
opt-level = 2

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# [profile.release]
# lto = true
# codegen-units = 1
# panic = "abort"

[package.metadata.release]
tag-message = "chore: :bookmark: Release `{{crate_name}}` version {{version}}"
publish = false
push = false

[dependencies]
arc-swap = { workspace = true }
ace = { workspace = true }
ctx = { workspace = true }
http = { workspace = true }
axum = { workspace = true, features = ["macros"] }
hyper = { workspace = true, features = ["full"] }
hyper-util = { workspace = true, features = ["full"] }
hyper-rustls = { workspace = true, features = [
    "http1",
    "http2",
    "ring",
    "webpki-tokio",
] }
hyper-tungstenite = { workspace = true }
http-body-util = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tokio-rustls = { workspace = true, features = ["ring"] }
tokio-tungstenite = { workspace = true, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
futures-util = { workspace = true }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = [
    "cors",
    "compression-gzip",
    "fs",
    "trace",
    "normalize-path",
] }
db = { workspace = true }
chrono = { workspace = true, default-features = true }
dotenvy = { workspace = true }
gate = { workspace = true }
hex = { workspace = true }
jwt = { workspace = true }
lb = { workspace = true }
mime = { workspace = true }
idp = { workspace = true }
oidc = { workspace = true }
otp = { workspace = true }
pw = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smtp = { workspace = true }
store = { workspace = true }
thiserror = { workspace = true }
tools = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras"] }
once_cell = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "form", "http2"] }
redis = { workspace = true, optional = true, features = [
    "tokio-rustls-comp",
    "tls-rustls-webpki-roots",
] }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "time",
] }
rustls = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true, default-features = true, features = [
    "env-filter",
    "fmt",
    "json",
    "time",
] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
opentelemetry = { workspace = true, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { workspace = true, features = [
    "trace",
    "metrics",
    "logs",
    "rt-tokio",
] }
# SDK batch workers run outside Tokio; the async reqwest-client would panic there.
opentelemetry-otlp = { workspace = true, features = [
    "trace",
    "metrics",
    "logs",
    "http-proto",
    "reqwest-blocking-client",
    "grpc-tonic",
    "tls-ring",
] }
opentelemetry-appender-tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
ulid = { workspace = true }
lim = { workspace = true }
lru = { workspace = true }
maxminddb = { workspace = true }
moka = { workspace = true, features = ["sync"] }
clap = { workspace = true, features = ["derive"] }

[features]
# No default profile: the `edge` and `cluster` backends are mutually
# exclusive, so a default would silently combine with an explicitly requested
# profile and fail to compile. Always build with exactly one profile, e.g.
# `cargo run --features edge` or `cargo build --release --features cluster`.
default = []
edge = ["sqlite", "memory"]
cluster = ["postgres", "redis"]
postgres = ["db/postgres"]
sqlite = ["db/sqlite"]
memory = ["store/memory", "gate/memory", "oidc/memory", "lim/memory"]
redis = ["dep:redis", "store/redis", "gate/redis", "lim/redis"]
redis-compression = ["store/compression"]

[dev-dependencies]
async-trait = { workspace = true }
prost = { workspace = true }
redis = { workspace = true, features = [
    "tokio-rustls-comp",
    "tls-rustls-webpki-roots",
] }
tokio = { workspace = true, features = ["test-util"] }
tonic = { workspace = true, features = ["transport", "tls-ring"] }
tonic-health = { workspace = true }
