[package]
name = "stargate"
version = "0.1.0"
description = "A powerful API gateway and IAM server built in Rust."
authors = ["Alessio Forte <fortealessio@gmail.com>"]
edition = "2024"
license = "MIT"
readme = "README.md"

[workspace.package]
version = "0.1.0"
authors = ["Alessio Forte <fortealessio@gmail.com>"]
edition = "2024"
license = "MIT"
readme = "README.md"

[workspace]
members = [
    ".",
    "crates/ace",
    "crates/db",
    "crates/gate",
    "crates/jwt",
    "crates/lb",
    "crates/lim",
    "crates/oauth",
    "crates/pw",
    "crates/smtp",
    "crates/store",
    "crates/tools"
]

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false
opt-level = 2

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# [profile.release]
# lto = true
# codegen-units = 1
# panic = "abort"

[package.metadata.release]
tag-message = "chore: :bookmark: Release `{{crate_name}}` version {{version}}"
publish = false
push = false

[dependencies]
ace = { path = "crates/ace" }
http = "1"
axum = { version = "0.8", features = ["macros"] }
hyper = { version = "1.9", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.27.9", features = ["http1", "http2", "ring", "webpki-tokio"] }
hyper-tungstenite = { version = "0.19" }
http-body-util = { version = "0.1" }
tokio-rustls = { version = "0.26", features = ["ring"] }
tokio-tungstenite = { version = "0.28", features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.32" }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "normalize-path"] }
utoipa-axum = { version = "0.2" }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
db = { path = "crates/db" }
chrono = "0.4.44"
dotenvy = "0.15.7"
gate = { path = "crates/gate" }
jwt = { path = "crates/jwt" }
lb = { path = "crates/lb" }
mime = "0.3.17"
oauth = { path = "crates/oauth" }
pw = { path = "crates/pw" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
smtp = { path = "crates/smtp" }
store = { path = "crates/store" }
thiserror = "2.0.12"
tools = { path = "crates/tools" }
utoipa = { version = "5.3.1", features = ["axum_extras", "yaml"] }
once_cell = "1.21.4"
serde_yaml_bw = "2.5.5"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
rustls = "0.23.39"
rustls-pemfile = "2.2.0"
anyhow = "1.0.102"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
ulid = "1.2.1"
lru = "0.17"
maxminddb = { version = "0.27.3", features = ["simdutf8"] }
moka = { version = "0.12.15", features = ["sync"] }
notify = "8.2.0"
clap = { version = "4.6.1", features = ["derive"] }

[features]
default = ["edge"]
edge = ["sqlite", "memory"]
cluster = ["postgres", "redis"]
postgres = ["db/postgres"]
sqlite = ["db/sqlite"]
memory = ["store/memory", "gate/memory"]
redis = ["store/redis", "gate/redis"]
memory-compression = ["store/compression"]
