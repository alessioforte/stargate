[package]
name = "stargate"
version = "0.1.0"
description = "A powerful API gateway and IAM server built in Rust."
authors = ["Alessio Forte <fortealessio@gmail.com>"]
edition = "2024"
license = "MIT"
readme = "README.md"

[workspace.package]
version = "0.1.0"
authors = ["Alessio Forte <fortealessio@gmail.com>"]
edition = "2024"
license = "MIT"
readme = "README.md"

[workspace]
members = [
    ".",
    "crates/ace",
    "crates/db",
    "crates/gate",
    "crates/jwt",
    "crates/lb",
    "crates/lim",
    "crates/oauth",
    "crates/pw",
    "crates/smtp",
    "crates/store",
    "crates/tools"
]

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false
opt-level = 2

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# [profile.release]
# lto = true
# codegen-units = 1
# panic = "abort"

[package.metadata.release]
tag-message = "chore: :bookmark: Release `{{crate_name}}` version {{version}}"
publish = false
push = false

[dependencies]
ace = { path = "crates/ace" }
actix-cors = "0.7.1"
actix-web = { version = "4.12.1", features = ["openssl"] }
actix-web-grants = "4.1.2"
actix-web-httpauth = "0.8.2"
actix-ws-proxy = "0.1.2"
awc = { version = "3.7.0", features = ["openssl", "rustls-0_23"] }
db = { path = "crates/db" }
chrono = "0.4.43"
dotenvy = "0.15.7"
gate = { path = "crates/gate" }
jwt = { path = "crates/jwt" }
lb = { path = "crates/lb" }
mime = "0.3.17"
oauth = { path = "crates/oauth" }
openssl = "0.10.72"
pw = { path = "crates/pw" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
smtp = { path = "crates/smtp" }
store = { path = "crates/store" }
thiserror = "2.0.12"
tools = { path = "crates/tools" }
utoipa = { version = "5.3.1", features = ["actix_extras", "yaml"] }
once_cell = "1.21.3"
serde_yaml_bw = "2.5.2"
notify-debouncer-mini = "0.7.0"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "time"] }
rustls = "0.23.36"
rustls-pemfile = "2.2.0"
anyhow = "1.0.100"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.3"
ulid = "1.2.1"
tracing-actix-web = "0.7.21"

[features]
default = ["sqlite", "redis"]
postgres = ["db/postgres"]
sqlite = ["db/sqlite"]
memory = ["store/memory", "gate/memory"]
redis = ["store/redis", "gate/redis"]
